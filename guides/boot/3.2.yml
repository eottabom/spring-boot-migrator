# yaml-language-server: $schema=../../schema/boot-guide.schema.json
source: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.2-Release-Notes

requirements:
  java: { min: 17, max: 23 }
  gradle: { "7": "7.5", "8": "8.0" }
  framework: "6.1"
  springCloud: { train: 2023.0.x, since: "2023.0.0" }
  springCloudAws: 3.1.x

checklist:
  - id: request-body-buffering
    title: 요청 본문을 버퍼링하지 않아 Content-Length 가 빠질 수 있음
    detail: Framework 6.1 부터 대부분의 `ClientHttpRequestFactory` 가 요청 본문을 버퍼링하지 않는다. JSON 같은 요청은 크기를 미리 알 수 없어 `Content-Length` 헤더가 설정되지 않는다. 이 헤더를 요구하는 서버와 연동하는 클라이언트는 `BufferingClientHttpRequestFactory` 로 감싼다. 버퍼링은 메모리를 더 쓰므로 필요한 클라이언트에만 적용한다.
    detect: com.eottabom.rewrite.detect.httpclient.FindRequestBodyBufferingCompatibilityRisk
    source: https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-6.1-Release-Notes
    when: { dependencies: [org.springframework:spring-web] }
  - id: catch-all-404
    title: 전역 예외 처리기가 404 를 500 으로 바꿀 수 있음
    detail: Framework 6.1 의 NoResourceFoundException 이 기존 Exception/Throwable 전역 처리기에 잡힐 수 있다. 전용 처리기, advice 우선순위와 응답 상태를 확인하고 없는 API 및 정적 리소스가 404 를 반환하는지 테스트한다. 탐지 위치는 검토 후보이며 실제 500 반환 여부를 단정하지 않는다.
    detect: com.eottabom.rewrite.detect.spring.FindCatchAllHandlerMasking404
    source: https://github.com/spring-projects/spring-boot/issues/38733
    when: { dependencies: [org.springframework:spring-webmvc] }
  - id: async-cache
    title: 비동기 반환값의 캐시 의미 및 provider 지원 변경
    detail: Framework 6.1 부터 CompletableFuture/Mono 의 완료 값과 Flux 가 완료되어 수집된 List 를 캐시한다. CaffeineCacheManager 의 asyncCacheMode 와 provider 의 비동기 조회 지원을 확인한다. 캐시 적중 시 호출 횟수, 오류 및 스트림 완료를 테스트한다. 검색은 같은 파일의 캐시 어노테이션과 비동기 타입 조합을 후보로 표시한다.
    detect: com.eottabom.rewrite.detect.cache.FindAsyncCacheConfigurationGap
    source: https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html
    when: { dependencies: [org.springframework:spring-context] }
  - id: transactional-event
    title: 트랜잭션 이벤트 리스너의 propagation 검증 강화
    detail: Framework 6.1 부터 TransactionalEventListener 에 부적절한 Transactional 을 함께 선언하면 기동이 거부될 수 있다. 메서드 및 클래스 수준 propagation, Async, 이벤트 phase 를 확인한다. REQUIRES_NEW 일괄 치환은 트랜잭션 경계와 커넥션 사용을 바꾸므로 하지 않는다. commit/rollback 별 저장 결과를 테스트한다.
    detect: com.eottabom.rewrite.detect.spring.FindTransactionalEventListenerConfiguration
    source: https://github.com/spring-projects/spring-framework/issues/30679
    when: { dependencies: [org.springframework:spring-tx] }
  - id: parameters
    title: 파라미터 이름 추론에 `-parameters` 컴파일 옵션 필요
    detail: Spring Framework 6.1 은 바이트코드에서 이름을 추론하지 않는다. `@PathVariable`/`@RequestParam`/`@Cacheable(key="#id")` 에서 이름을 생략하면 런타임 오류. Boot Gradle 플러그인을 적용하지 않은 모듈(공용 라이브러리 모듈 등)에 `-parameters` 를 켠다
  - id: nested-jar-launcher
    title: 실행 jar 로더 패키지 변경 (Dockerfile 확인)
    detail: layered jar 를 풀어서 `java org.springframework.boot.loader.JarLauncher` 로 띄우던 Dockerfile 은 `org.springframework.boot.loader.launch.JarLauncher` 로 바꿔야 한다. 레시피는 저장소 밖 이미지 빌드 설정을 확인하지 못한다
  - id: feign-retryable
    title: Feign 12 RetryableException 생성자 변경
    detail: null 인자 모호성은 레시피가 보정한다. 커스텀 ErrorDecoder 의 재시도 조건을 확인한다
    fix: auto
    recipe: com.eottabom.rewrite.custom.feign.DisambiguateRetryableExceptionNull
    when: { dependencies: [io.github.openfeign:*] }
  - id: oracle-ucp
    title: Oracle UCP validateConnectionOnBorrow 기본값 해제
    detail: 유지하려면 `spring.datasource.oracleucp.validate-connection-on-borrow=true`
    when: { dependencies: [com.oracle.database.jdbc:ucp*] }
  - id: security-user-backoff
    title: OAuth2/SAML2 가 있으면 InMemoryUserDetailsManager 자동 설정이 빠짐
    detail: "`spring.security.user.*` 를 설정하지 않았다면 기본 사용자 계정이 사라진다. 이 계정으로 붙던 actuator/내부 호출을 확인한다"
    when: { dependencies: [org.springframework.security:*] }
  - id: otlp-endpoint
    title: OTLP tracing endpoint 기본값 제거
    detail: "`management.otlp.tracing.endpoint` 를 명시하지 않으면 trace 를 보내지 않는다"
    when: { dependencies: [io.opentelemetry:*, io.micrometer:micrometer-tracing-bridge-otel] }

failureHints:
  - pattern: parameter name information not available
    text: Spring 6.1 부터 파라미터 이름을 바이트코드에서 읽지 않아요. `-parameters` 컴파일 옵션을 켜거나 어노테이션에 이름을 적어 주세요
