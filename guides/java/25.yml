# yaml-language-server: $schema=../../schema/java-guide.schema.json
source: https://docs.openrewrite.org/recipes/java/migrate/upgradetojava25

gradle: "9.1"

checklist:
  - id: outside-repo
    title: 배포 이미지와 CI 의 JDK 를 25 로
    detail: Dockerfile 베이스 이미지, CI, 배포 도구 설정은 저장소 밖이라 레시피가 못 바꾼다
  - id: lombok
    title: Lombok 1.18.40+ 는 Jackson 어노테이션을 accessor 로 복사하지 않음
    detail: JDK 25 에 필요한 Lombok 버전에서 `@JsonProperty` 등이 getter/setter 로 복사되지 않아 직렬화 필드 이름이 바뀔 수 있다. 레시피가 lombok.config 로 복사를 켠다
    fix: auto
    recipe: com.eottabom.rewrite.custom.lombok.EnableLombokCopyJacksonAnnotations
    when: { dependencies: [org.projectlombok:*] }
  - id: security-manager
    title: SecurityManager 완전 제거
    detail: 이를 쓰던 라이브러리/설정(`-Djava.security.manager`)을 확인한다
