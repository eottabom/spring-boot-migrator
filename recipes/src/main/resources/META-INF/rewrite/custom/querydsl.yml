type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.custom.querydsl.MigrateQuerydslToJakarta
displayName: QueryDSL Jakarta Classifier 적용
description: >-
  querydsl-apt 의 `jpa` classifier 를 `jakarta` 로 바꾸고, querydsl-jpa 에도 `jakarta` classifier 를 붙인다.
  (javax.persistence 기반 Q-class 가 생성되는 문제 방지)
  upstream ChangeDependencyClassifier 는 GString("...:${ver}:jpa") / 버전 생략 선언을 처리하지 못해 커스텀 레시피를 사용한다.
recipeList:
  - com.eottabom.rewrite.custom.querydsl.QuerydslJakartaClassifier
  - com.eottabom.rewrite.custom.querydsl.EnsureQuerydslAptJakartaApis
