# yaml-language-server: $schema=../../../../../../../schema/rewrite-recipe.schema.json
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.custom.aws.UnpinAwsSdkVersions
displayName: AWS SDK 고정 버전 제거 (Spring Cloud AWS BOM 에 맡김)
description: >-
  Spring Cloud AWS BOM 은 AWS SDK BOM 을 import 한다. software.amazon.awssdk:s3:2.21.12 처럼 일부만 버전을 박아두면
  Spring Cloud AWS 를 올릴 때 sdk-core 만 올라가 IncompatibleClassChangeError (overrides final method setOverrides) 가 난다.
  Spring Cloud AWS 를 쓰는 모듈에서만 버전을 지운다. (BOM 좌표 platform("...:bom:x") 는 유지)
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: io.awspring.cloud
      artifactIdPattern: "*"
recipeList:
  - com.eottabom.rewrite.custom.gradle.RemoveDependencyVersion:
      groupId: software.amazon.awssdk
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.custom.aws.MigrateSpringCloudAws_2_to_3
displayName: Spring Cloud AWS 2.x -> 3.0 (artifact 이름 변경)
description: >-
  Spring Cloud AWS 3.0 에서 바뀐 starter artifact 이름으로 교체한다. (Boot 2.7 -> 3.0 전환 시 필요)
  SQS/SNS messaging 은 API 자체가 바뀌므로 artifact 교체 후 코드 수정이 필요하다.
recipeList:
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.awspring.cloud
      oldArtifactId: spring-cloud-starter-aws-secrets-manager-config
      newArtifactId: spring-cloud-aws-starter-secrets-manager
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.awspring.cloud
      oldArtifactId: spring-cloud-starter-aws-parameter-store-config
      newArtifactId: spring-cloud-aws-starter-parameter-store
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.awspring.cloud
      oldArtifactId: spring-cloud-starter-aws-messaging
      newArtifactId: spring-cloud-aws-starter-sqs
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.awspring.cloud
      oldArtifactId: spring-cloud-starter-aws
      newArtifactId: spring-cloud-aws-starter
  - com.eottabom.rewrite.custom.aws.UpgradeSpringCloudAws_3_0
---
type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.custom.aws.UpgradeSpringCloudAws_3_0
displayName: Spring Cloud AWS 3.0.x
description: Spring Boot 3.0 / 3.1 호환 Spring Cloud AWS 3.0.x 로 업그레이드
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.awspring.cloud
      artifactId: "*"
      newVersion: 3.0.x
