type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.custom.logging.FixLogstashDecoratorForJackson3
displayName: logstash JsonGeneratorDecorator 의 ObjectMapper 변경 코드 제거 (Jackson 3)
description: >-
  Jackson 2 시절 decorator 안에서 `(ObjectMapper) generator.getCodec()` 을 꺼내 feature 를 켜던 코드.
  Jackson 3 의 ObjectMapper 는 불변이라 enable/disable/configure 가 없고, upstream 이 바꾼
  `(ObjectMapper) generator.objectWriteContext()` 는 런타임에 ClassCastException 이 난다.
  decorator 안의 해당 호출과, 그래서 안 쓰이게 된 ObjectMapper 지역 변수를 함께 제거한다.
  generator 에 역직렬화 feature 를 켜던 코드라 원래도 출력에는 효과가 없었다. 필요하면 logstash encoder 의 jsonFactory 설정으로 옮긴다.
preconditions:
  - org.openrewrite.java.search.FindImplementations:
      typeName: net.logstash.logback.decorate.JsonGeneratorDecorator
recipeList:
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: "*..ObjectMapper enable(..)"
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: "*..ObjectMapper disable(..)"
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: "*..ObjectMapper configure(..)"
  - org.openrewrite.staticanalysis.RemoveUnusedLocalVariables:
      withType: tools.jackson.databind.ObjectMapper
      withSideEffects: true
  - org.openrewrite.staticanalysis.RemoveUnusedLocalVariables:
      withType: com.fasterxml.jackson.databind.ObjectMapper
      withSideEffects: true
  - org.openrewrite.java.RemoveUnusedImports
---
