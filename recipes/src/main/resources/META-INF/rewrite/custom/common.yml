type: specs.openrewrite.org/v1beta/recipe
name: com.eottabom.rewrite.custom.CommonFixes
displayName: 공통 마이그레이션 보정
description: >-
  JDK 호환성이 버전에 강하게 묶인 라이브러리(Lombok)를 올린다.
  각 단계 레시피의 마지막에 실행된다.
  주의) org.openrewrite.gradle.RemoveRedundantDependencyVersions 는 groupPattern 을 줘도 "transitive 로 충족되는 direct 의존성" 까지
  삭제한다(ex. spring-boot-starter-cache, querydsl-core, testAnnotationProcessor lombok). 절대 사용하지 않는다.
recipeList:
  # Lombok 은 JDK 버전에 강하게 묶여 있다 (Java 21 은 1.18.30+ 필요)
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.projectlombok
      artifactId: lombok
      newVersion: 1.18.x
  # Lombok 1.18.40+ 는 @JsonProperty 를 getter 에 복사하지 않아 `@JsonProperty("isShow") boolean isShow` 가 JSON 에 isShow, show 로
  # 두 번 나간다. lombok.config 로 이전 동작 유지 (Lombok + Jackson 어노테이션을 쓰는 프로젝트만)
  - com.eottabom.rewrite.custom.lombok.EnableLombokCopyJacksonAnnotations
  # commons-lang 2 import 를 lang3 로 (3.x 에서 시작하면 3.0 단계의 upstream 전환을 거치지 않는다. 실측, 3.5 에서 transitive commons-lang 2 가 빠져 컴파일 에러)
  - com.eottabom.rewrite.custom.misc.MigrateCommonsLang2Usages
  - com.eottabom.rewrite.custom.misc.RemoveUnusedCommonsLang2
  - com.eottabom.rewrite.custom.gradle.DeclareUsedTransitiveDependencies
  - com.eottabom.rewrite.custom.misc.UnshadeRelocatedImports
  # Hypersistence JSON 속성 객체: Serializable 이 아니면 저장/수정 시 NonSerializableObjectException,
  # List/Map 원소에 equals 가 없으면 트랜잭션마다 유령 UPDATE
  - com.eottabom.rewrite.custom.hibernate.FixJsonColumnValueTypes
  # upstream 이 HikariConfig 빈에 @DependsOnDatabaseInitialization 을 붙여 DB 초기화 빈과 순환 참조가 생기는 문제
  - com.eottabom.rewrite.custom.spring.RemoveDependsOnDatabaseInitializationFromDataSourceConfig
  # Kafka 는 Boot BOM 이 clients / streams / test-utils 를 같은 버전으로 관리한다.
  # 하나라도 버전을 박아두면 Boot 업그레이드 후 섞여서 NoSuchMethodError 가 난다 (ex. kafka-streams-test-utils:3.9.0 + Kafka 4.x)
  - com.eottabom.rewrite.custom.gradle.RemoveDependencyVersion:
      groupId: org.apache.kafka
  - com.eottabom.rewrite.custom.aws.UnpinAwsSdkVersions
  # Hibernate 버그 수정(HHH-17294, HHH-18378 등)은 패치 릴리즈로 나온다. 버전을 박아두면 Boot 를 올려도 수정이 반영되지 않는다
  - com.eottabom.rewrite.custom.gradle.RemoveDependencyVersion:
      groupId: org.hibernate.orm
  # Boot 모듈은 BOM 이 관리한다. upstream 이 추가하며 박은 버전(ex. spring-boot-starter-jdbc-test:4.0.8)이 남으면 다음 단계에서 어긋난다
  - com.eottabom.rewrite.custom.gradle.RemoveDependencyVersion:
      groupId: org.springframework.boot
  # upstream 이 같은 실행 안에서 여러 번 jaxb-api 를 추가할 수 있어서 매 단계 마지막에 정리한다
  - com.eottabom.rewrite.custom.spring.RemoveSpuriousJaxbApi
  # upstream 의존성 레시피가 중첩 빌드의 settings 스크립트에 dependencies 블록을 넣는 문제 보정 (의존성 레시피들 뒤에 둔다)
  - com.eottabom.rewrite.custom.gradle.RemoveDependenciesFromSettingsScript
  # 위 레시피와 단계 레시피가 문자열로 추가한 의존성을 catalog 항목으로 옮긴다 (catalog 를 쓰는 프로젝트만, 마지막에 둔다)
  - com.eottabom.rewrite.custom.gradle.DeclareAddedDependenciesInVersionCatalog
